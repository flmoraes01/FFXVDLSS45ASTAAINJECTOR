; FFXV DLSS4 - replaces the game's anti-aliasing with current DLSS Super Resolution
; Recommended: select TAA in the game. The mod runs DLSS in place of the game's TAA pass, at any
; resolution, using the game's own TAA jitter. The game's "NVIDIA DLSS" option (4K only) also works.

[DLSS]
; 1 = mod active, 0 = game uses its original NGX path untouched
Enabled=1

; 1 = run DLSS in place of the game's TAA (choose TAA in the game), 0 = keep the game's TAA
; The game's resolution scale then acts as the DLSS mode: 100% = DLAA, 75% = Quality, 50% = Performance
ReplaceTAA=1
; DLSS model used in place of TAA (same values as Preset below)
TAAPreset=L

; DLSS model for the game's "NVIDIA DLSS" option: M, L, K, J or Default
;   M = 2nd-gen transformer, tuned for Performance (default)
;   L = 2nd-gen transformer, tuned for Ultra Performance / very low input resolution
;   K = 1st-gen transformer (DLAA / Quality / Balanced)
Preset=M

; Depth buffer convention. Auto detects it from the game's depth clears (reversed-Z = 1).
DepthInverted=Auto

; How cbMotMat.g_jitterOfs is interpreted: Auto, Absolute, Delta or Off
JitterMode=Auto
; Sign/scale applied to the jitter sent to DLSS. Use -1 on an axis if the image shimmers or wobbles.
JitterScaleX=1
JitterScaleY=1

; Multipliers on the game's MV.Scale. Use -1 on an axis if moving objects smear or ghost.
MVScaleX=1
MVScaleY=1
; Set to 1 only if motion vectors turn out to include the jitter
MVJittered=0

; 1 = log per-frame details and NGX messages to FFXV_DLSS4.log (first ~400 frames)
VerboseLog=0
